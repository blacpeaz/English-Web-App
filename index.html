<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Miteny English</title>
<meta name="theme-color" content="#0B6B3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Base reset */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: one narrow phone column; lesson screens are a step rail on top, content, then one primary action. */
:root{
  --bg:#F1F5F0; --surface:#FFFFFF; --sunk:#E4ECE5; --ink:#132219; --muted:#56685C; --line:#CFDBD2;
  --green:#0B6B3D; --green-soft:#D5EBDD; --red:#C8322A; --red-soft:#F7DEDB; --gold:#D9A21B; --gold-soft:#FBEFCF;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#16211A; --sunk:#1D2A21; --ink:#E6EEE8; --muted:#9BB0A2; --line:#2C3D32;
  --green:#4CC384; --green-soft:#183A27; --red:#FF7468; --red-soft:#3D1E1B; --gold:#E9BF4E; --gold-soft:#3A3016; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --sunk:#1D2A21; --ink:#E6EEE8; --muted:#9BB0A2; --line:#2C3D32;
  --green:#4CC384; --green-soft:#183A27; --red:#FF7468; --red-soft:#3D1E1B; --gold:#E9BF4E; --gold-soft:#3A3016; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.app{max-width:580px;margin:0 auto;padding-block:12px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.mg{display:block;color:var(--muted);font-size:.88em;font-style:italic;margin-top:2px}
.mg.inline{display:inline;margin:0}
.muted{color:var(--muted)}
.kicker{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.tight{gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Buttons */
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.w:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.95rem}
.btn svg{width:18px;height:18px;flex:none}
.btn.ghost{background:transparent}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--bg);width:100%;min-height:54px;font-size:1.05rem;border-radius:var(--r)}
.btn.primary[disabled]{opacity:.45;cursor:default}
.btn.mic{border-color:var(--red);color:var(--red)}
.btn.mic.on{background:var(--red);color:var(--bg);animation:pulse 1.2s ease-in-out infinite}
.btn.toggle[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold)}
.btn.big{min-height:64px;padding:0 28px;font-size:1.1rem}
.link{background:none;border:0;padding:6px 0;color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:3px}
@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.btn.mic.on{animation:none}*{transition:none!important}}

/* Top bar */
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.top .x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.top .x svg{width:18px;height:18px}
.bar{flex:1;height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.steps{display:flex;gap:6px;flex:1;min-width:0}
.steps span{flex:1;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:4px solid var(--sunk);padding-top:5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps span.done{border-color:var(--green)}
.steps span.now{border-color:var(--gold);color:var(--ink)}

/* Brand header */
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0 22px;border-bottom:1.5px solid var(--line);margin-bottom:22px}
.brand b{font:800 1.5rem/1 var(--display);letter-spacing:-.02em}
.brand b em{font-style:normal;color:var(--green)}

/* Panels */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:18px}
.hero{background:var(--green);color:var(--bg);border-radius:var(--r);padding:24px 20px;display:flex;flex-direction:column;gap:12px}
.hero .mg{color:inherit;opacity:.8}
.hero .btn{background:var(--bg);color:var(--green);border-color:var(--bg);align-self:flex-start;min-height:52px;padding:0 22px}
.inst{background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:.95rem}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat b{display:block;font:800 1.6rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.8rem;font-weight:700}
@media (min-width:520px){.stats{grid-template-columns:repeat(4,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--red-soft);color:var(--red)}
.chip.ok{background:var(--green-soft);color:var(--green)}

/* Course outline */
.lvl{border-top:1.5px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.lvl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvl-h .tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--bg);background:var(--gold);padding:2px 8px;border-radius:6px}
.les{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:60px}
.les .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--sunk);flex:none}
.les.done .n{background:var(--green);color:var(--bg)}
.les.next{border-color:var(--green);box-shadow:inset 4px 0 0 var(--green)}
.les .t{flex:1;min-width:0}
.les .t small{display:block;color:var(--muted);font-size:.8rem}
.les .s{font-variant-numeric:tabular-nums;font-weight:700;color:var(--green);font-size:.9rem}
.soon{color:var(--muted);font-size:.9rem;padding:10px 14px;border:1.5px dashed var(--line);border-radius:12px}

/* Reading */
.passage{display:flex;flex-direction:column;gap:12px;font-size:1.1rem;line-height:1.75}
.line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:6px 8px;border-radius:10px;transition:background .2s}
.line.hl{background:var(--gold-soft)}
.line .who{display:block;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--green)}
.line .txt{min-width:0}
.say{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:2px}
.say svg{width:16px;height:16px}
.w{background:none;border:0;padding:0 1px;font:inherit;color:inherit;border-bottom:2.5px solid var(--gold);cursor:pointer;line-height:1.3}
.w.seen{border-bottom-color:var(--green)}
.reading p{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1rem}

/* Word cards */
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .en{font:600 1.3rem/1.2 var(--display)}
.say-as{font-family:var(--mono);font-size:.82rem;color:var(--muted);letter-spacing:.02em}
.trans{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.95rem}
.trans dt{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--muted);padding-top:3px}
.trans dd{margin:0;min-width:0}
.ex{font-style:italic;color:var(--muted);font-size:.92rem}

/* Questions */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;width:100%;min-height:54px;padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1.02rem}
.opt.picked{border-color:var(--gold);background:var(--gold-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--green-soft)}
.fb.no{background:var(--red-soft)}
.fb b{font-family:var(--display);font-size:1.15rem}
.fb.ok b{color:var(--green)}
.fb.no b{color:var(--red)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.match .opt{min-height:52px;font-size:.95rem;text-align:center;overflow-wrap:anywhere}
.match .opt.gone{opacity:.45}

/* Speaking */
.spk{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.spk-text{font:600 1.3rem/1.35 var(--display)}
.spk-text span{border-radius:4px;padding:0 2px;transition:background .2s}
.spk-text span.ok{background:var(--green-soft);color:var(--green)}
.spk-text span.bad{background:var(--red-soft);color:var(--red)}
.tip{font-size:.92rem;border-left:3px solid var(--gold);padding-left:10px}
.spk-res{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green)}

/* Results */
.big-level{font:800 2.6rem/1 var(--display);letter-spacing:-.03em;color:var(--green)}
.sec{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.92rem}
.sec .meter{height:10px}
.sec .meter i.low{background:var(--red)}
.sec .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.score-ring{font:800 3.4rem/1 var(--display);color:var(--green);font-variant-numeric:tabular-nums}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;border-top:1.5px solid var(--line);max-width:580px;margin:0 auto;padding-top:18px;padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px));padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:10px;max-height:85%;overflow:auto}
.codebox{font:500 1.15rem/1.3 var(--mono);letter-spacing:.02em;background:var(--surface);border:1.5px dashed var(--gold);border-radius:10px;padding:12px 14px;text-align:center;overflow-wrap:anywhere;user-select:all}
.codebox.inline{display:inline;font-size:.95rem;padding:2px 6px;border-radius:6px}
.input{width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 1.05rem var(--mono)}
.input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.sync{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.sync.ok{background:var(--green-soft);color:var(--green)}
.review-item{border-left:3px solid var(--red);padding-left:12px;display:flex;flex-direction:column;gap:2px;font-size:.95rem}
.textarea{width:100%;min-height:150px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:1.02rem/1.5 var(--body);resize:vertical}
.textarea:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.ai-tag{font-size:.65rem;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:5px;background:var(--gold-soft);color:var(--ink);vertical-align:2px;margin-left:6px}
.loading{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding:48px 8px}
.loading .bar{width:100%;max-width:320px;flex:none}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--green);animation:dot 1.2s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.corr{background:var(--green-soft);border-radius:10px;padding:12px 14px;white-space:pre-wrap}
.mist{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--red);padding-left:10px;font-size:.95rem}
.mist s{color:var(--red)}.mist b{color:var(--green)}
.voices{display:flex;flex-direction:column;gap:8px;max-height:42vh;overflow:auto;padding:2px}
.vrow{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface)}
.vrow.on{border-color:var(--green);background:var(--green-soft)}
.vrow .vpick{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0}
.vrow .vpick small{display:block;color:var(--muted);font-size:.8rem}
.slider{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:.92rem}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--green)}
.slider .ends{grid-column:1/-1;display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem}
.iconbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem}
.iconbtn svg{width:16px;height:16px}
.daily{border-color:var(--green)}
.fcard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:10px;min-height:170px}
.fcard .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fcard .head>div{min-width:0}
.fword{display:block;font:800 2.2rem/1.1 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.pos{display:block;margin-top:4px;font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.exs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.exs li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.exs li span{min-width:0;padding-top:6px}
.wrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;border-top:1px solid var(--line);padding-top:8px}
details.panel summary{list-style-position:inside}
.moneybox{background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.moneybox .kicker{color:var(--ink)}
.src{font-size:.85rem;color:var(--muted)}
.money{border-color:var(--gold)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;min-height:118px;min-width:0}
.tile b{font:600 1.15rem/1.2 var(--display)}
.tile .tline{font-size:.9rem;font-weight:700;color:var(--green);margin-top:4px;overflow-wrap:anywhere}
.tile small{color:var(--muted);font-size:.78rem;margin-top:auto}
.rub{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:.92rem}
.rub .meter{height:10px}.rub .meter i.low{background:var(--red)}
.rule{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--green);padding-left:10px}
.rule span{color:var(--muted);font-style:italic}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{display:flex;gap:8px;align-items:flex-start;max-width:88%;padding:10px 12px;border-radius:14px;font-size:1rem}
.bubble span{min-width:0}
.bubble.ai{background:var(--surface);border:1.5px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:var(--green-soft);align-self:flex-end;border-bottom-right-radius:4px}
.bubble .say{width:32px;height:32px;flex:none}
.bfix{align-self:flex-end;max-width:88%;font-size:.88rem;background:var(--gold-soft);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:grid;grid-template-columns:auto 1fr auto;gap:8px;font-size:.92rem;align-items:center}
.chk>span:first-child{color:var(--muted);font-weight:700}
.chk.ok>span:first-child{color:var(--green)}
.chk b{font-variant-numeric:tabular-nums}
.cert{background:var(--green);color:var(--bg);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.confirm{background:var(--red-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
</style>
</head>

<script>
/* ================= CONTENT ================= */
const LEVELS=[
 {n:1,name:"Beginner",mg:"Vao manomboka"},
 {n:2,name:"Elementary",mg:"Fototra"},
 {n:3,name:"Intermediate",mg:"Antonony"},
 {n:4,name:"Upper-intermediate",mg:"Ambonin'ny antonony"},
 {n:5,name:"Advanced",mg:"Ambony"}];

/* Glossary: en, say (sound guide, CAPITALS = stress), mg, fr, def, ex */
const W={
 morning:["morning","MOR-ning","maraina","matin","the early part of the day","I drink coffee every morning."],
 name:["name","NAYM","anarana","nom","what people call you","My name is Hery."],
 meet:["meet","MEET (long ee)","mihaona, mifankahalala","rencontrer","to see someone, often for the first time","Nice to meet you."],
 work:["work","WERK","miasa","travailler","to do a job","I work in an office."],
 warehouse:["warehouse","WAIR-haus","trano fitehirizan'entana","entrepôt","a big building where goods are kept","The boxes are in the warehouse."],
 teacher:["teacher","TEE-cher","mpampianatra","enseignant(e)","a person who helps students learn","My teacher is very kind."],
 teach:["teach","TEECH","mampianatra","enseigner","to help someone learn","She teaches English."],
 learn:["learn","LERN","mianatra","apprendre","to get new knowledge or a new skill","I want to learn English."],
 practice:["practice","PRAK-tis","miofana, manazatra tena","s'entraîner","to do something again and again to get better","Practice a little every day."],
 tomorrow:["tomorrow","tu-MOR-oh","rahampitso","demain","the day after today","See you tomorrow!"],
 fresh:["fresh","FRESH","vaovao, mbola tsara","frais","new and in good condition","The fish is fresh."],
 howmuch:["how much","HAU MATCH","ohatrinona","combien","words to ask a price","How much is this shirt?"],
 kilo:["kilo","KEE-loh","kilao","kilo","1,000 grams","One kilo of rice, please."],
 expensive:["expensive","ik-SPEN-siv","lafo","cher","costs a lot of money","This phone is expensive."],
 price:["price","PRAIS","vidiny","prix","how much money something costs","The price is good."],
 take:["take","TAYK","maka","prendre","to get something and keep it","I will take two kilos."],
 sweet:["sweet","SWEET","mamy","sucré","tastes like sugar","Mangoes are sweet."],

function pickFresh(pool,n){const seen=new Set(S.qSeen||[]),un=shuffle(pool.filter(x=>!seen.has(qid(x)))),old=shuffle(pool.filter(x=>seen.has(qid(x))));return un.concat(old).slice(0,n)}
// one reading passage (all its questions), preferring a passage not seen before
function pickPassage(pool){const gs=[...new Set(pool.map(x=>x.g))],seen=new Set(S.qSeen||[]);
  const fresh=gs.filter(g=>pool.filter(x=>x.g===g).every(x=>!seen.has(qid(x))));
  const g=(fresh.length?shuffle(fresh):shuffle(gs))[0];return pool.filter(x=>x.g===g)}

  (r.words||[]).forEach(w=>{const en=String(w.en||"").trim();if(!en||known.has(en.toLowerCase())||words.length>=n)return;known.add(en.toLowerCase());
   words.push({en,say:String(w.say||""),pos:String(w.pos||""),mg:String(w.mg||""),fr:String(w.fr||""),def:String(w.def||""),ex:(w.examples||[]).map(String).filter(Boolean).slice(0,3)})});
  if(!words.length)throw new AIError("default");
 }catch(e){
  if(["need-pin","bad-pin","pin-not-set","locked"].includes(e.code))return dailyNoAI(e);
  words=localWords(n,lv);note=aiMsg(e)[0];
  if(!words.length&&!dueReviewKeys().length)return aiFailed(e);
 }
 const keys=[];words.forEach(w=>{let k=vslug(w.en);while(S.vocab[k])k+="x";S.vocab[k]=Object.assign(w,{box:0,due:null,added:today()});keys.push(k)});
 S.daily={date:today(),keys,review:dueReviewKeys().slice(0,6),i:0,wi:0,phase:"learn",sent:{},started:Date.now(),note};
 registerVocab();save();D={flip:false};renderDaily();
}
function renderDaily(){window.scrollTo(0,0);if(TTS)speechSynthesis.cancel();const d=S.daily;if(d.phase==="learn")return renderCard();if(d.phase==="write")return renderWrite();dailySummary()}
function dailyTop(frac,label){return `<div class="top"><button class="x" data-act="home" aria-label="Leave daily words">${ICON.x}</button><div class="bar"><i style="width:${pct(frac)}%"></i></div><span class="muted" style="font-size:.85rem;font-variant-numeric:tabular-nums">${label}</span></div>`}
function exList(v){return `<ul class="exs">${(v.ex||[]).map((x,i)=>`<li><button class="say" data-act="dsayex" data-i="${i}" aria-label="Listen to this example">${ICON.spk}</button><span>${esc(x)}</span></li>`).join("")}</ul>`}
function renderCard(){
 const d=S.daily,its=dailyItems(),it=its[d.i];
 if(!it){d.phase=d.keys.length?"write":"done";d.wi=0;save();return d.phase==="done"?finishDaily():renderDaily()}
 const v=S.vocab[it.k];
 view.innerHTML=dailyTop(d.i/its.length,`${d.i+1}/${its.length}`)+`<div class="stack">
  ${d.note&&d.i===0?`<p class="inst">${esc(d.note)} Today's words come from your lessons instead.</p>`:""}
  <p class="kicker">${it.rev?"Review · Famerenana":"New word · Teny vaovao"}</p>
  <section class="fcard"><div class="head"><div><span class="fword">${esc(v.en)}</span>${v.pos?`<span class="pos">${esc(v.pos)}</span>`:""}</div><button class="say" data-act="dsay" aria-label="Listen">${ICON.spk}</button></div>
   <span class="say-as">${esc(v.say)}</span>
   ${D.flip?`<dl class="trans"><dt>MG</dt><dd><b>${esc(v.mg)}</b></dd><dt>FR</dt><dd>${esc(v.fr)}</dd><dt>EN</dt><dd>${esc(v.def)}</dd></dl><p class="kicker">Examples · Ohatra</p>${exList(v)}`:""}
  </section>
  ${!D.flip?`<p class="muted" style="text-align:center">${it.rev?"Do you remember what it means? Think first, then check.":"Say the word aloud, then see what it means."}<span class="mg">${it.rev?"Mbola tadidinao ve ny dikany? Eritrereto aloha.":"Tenony mafy ny teny, avy eo jereo ny dikany."}</span></p><button class="btn primary" data-act="dflip">Show meaning · Asehoy ny dikany</button>`
   :it.rev?`<div class="row" style="flex-wrap:nowrap"><button class="btn" data-act="drate" data-v="0" style="flex:1;min-height:54px">I forgot</button><button class="btn primary" data-act="drate" data-v="1" style="flex:1">I remembered</button></div>`
   :`<button class="btn primary" data-act="dnext">${d.i===its.length-1?"Now write sentences · Manorata":"Next word · Teny manaraka"}</button>`}
 </div>`;
 if(!D.flip)say(v.en);
}
function curCardKey(){return dailyItems()[S.daily.i].k}
function rateCard(ok){const d=S.daily,k=curCardKey(),v=S.vocab[k];
 if(ok){v.box=Math.min(6,(v.box||1)+1);v.due=addDays(today(),BOX_DAYS[v.box])}else{v.box=1;v.due=addDays(today(),1);S.hard[k]=0}
 d.i++;D.flip=false;save();renderCard()}
function sentResult(st){const r=st.res;
 if(r.local)return `<div class="fb no"><b>Not checked</b><p>${esc(r.msg)} Compare your sentence with the examples.</p></div>`;
 if(r.correct)return `<div class="fb ok"><b>Correct! · Marina!</b><p>${esc(r.why)}<span class="mg">${esc(r.mg)}</span></p>${r.better?`<p style="margin-top:6px"><b style="font-size:1rem">A more natural way:</b> ${esc(r.better)}</p>`:""}</div>`;
 return `<div class="fb no"><b>Not quite · Tsy dia marina</b><p>${esc(r.why)}<span class="mg">${esc(r.mg)}</span></p></div>
  <div class="stack tight" style="margin-top:12px"><p class="kicker">The correct way · Ny fomba marina</p><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><p class="corr" style="flex:1;min-width:0">${esc(r.corrected)}</p><button class="say" data-act="dsaycorr" aria-label="Listen to the correct sentence">${ICON.spk}</button></div></div>`}
function renderWrite(){
 const d=S.daily,n=d.keys.length,k=d.keys[d.wi||0];if(!k){d.redo=false;return finishDaily()}
 const v=S.vocab[k],st=d.sent[k]||{},last=d.wi===n-1,canRetry=st.res&&!st.res.correct&&!st.res.local&&(st.tries||0)<3;
 let btns;
 if(!st.res&&st.err)btns=`<button class="btn primary" data-act="dcheck">Check again · Hamarino indray</button><button class="link" data-act="dlater" style="align-self:center">Check it later and go to the ${last?"summary":"next word"}</button>`;
 else if(!st.res)btns=`<button class="btn primary" data-act="dcheck">Check my sentence · Hamarino</button><button class="link" data-act="dskip" style="align-self:center">Skip this word</button>`;
 else if(canRetry)btns=`<button class="btn primary" data-act="dtry">Try again · Andramo indray</button><button class="link" data-act="dwnext" style="align-self:center">${last?"Finish":"Next word"}</button>`;
 else btns=`<button class="btn primary" data-act="dwnext">${last?"Finish · Vita":"Next word · Teny manaraka"}</button>`;
 view.innerHTML=dailyTop(d.wi/n,`${d.wi+1}/${n}`)+`<div class="stack">
  <div><p class="kicker">Make a sentence · Manaova fehezanteny</p><h2>Write your own sentence with “${esc(v.en)}”</h2><span class="mg">Manorata fehezanteny misy ny teny “${esc(v.en)}” (${esc(v.mg)}).</span></div>
  <details class="panel"><summary class="muted" style="cursor:pointer;font-weight:700">See the meaning and examples again</summary><div class="stack tight" style="margin-top:10px"><p>${esc(v.def)}</p>${exList(v)}</div></details>
  <label for="sentBox" class="muted" style="font-size:.9rem">Your sentence${st.tries?` · try ${Math.min(st.tries+(st.res?0:1),3)} of 3`:""}</label>
  <textarea id="sentBox" class="textarea" style="min-height:96px" placeholder="Write one sentence about your life…" ${st.res?"readonly":""}>${esc(st.text||"")}</textarea>
  <div id="sentRes" class="stack tight" aria-live="polite">${st.res?sentResult(st):st.err?`<div class="fb no"><b>Not checked yet</b><p>${esc(st.err[0])} Your sentence is saved. When you are back online, tap “Check again”.<span class="mg">${esc(st.err[1])} Voatahiry ny fehezantenyo. Tsindrio “Check again” rehefa misy internet.</span></p></div>`:""}</div>
  ${btns}</div>`;
}
async function checkSentence(){
 const d=S.daily,k=d.keys[d.wi],v=S.vocab[k],st=d.sent[k]=d.sent[k]||{tries:0};
 const box=document.getElementById("sentBox"),text=box.value.trim(),res=document.getElementById("sentRes");st.text=box.value;
 if(text.split(/\s+/).length<3){res.innerHTML=`<p class="muted">Write a full sentence (at least 3 words).<span class="mg">Manorata fehezanteny feno (teny 3 farafahakeliny).</span></p>`;return}
 const flat=x=>String(x).toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
 if((v.ex||[]).some(x=>flat(x)===flat(text))){res.innerHTML=`<p class="muted">That is one of the examples. Write your own sentence, for example about your work or your family.<span class="mg">Ohatra iray io. Manorata fehezanteny anao manokana.</span></p>`;return}
 const btn=view.querySelector('[data-act="dcheck"]');btn.disabled=true;btn.textContent="The teacher is checking…";
 try{
  const r=await aiCall("sentence",{level:S.level||1,word:v.en,def:v.def,sentence:text});
  st.tries=(st.tries||0)+1;st.res={correct:!!r.correct,corrected:String(r.corrected||""),why:String(r.why||""),mg:String(r.mg||""),better:String(r.better||"")};
  st.err=null;st.pending=false;
  if(st.res.correct)st.ok=true;else if(st.res.corrected)S.mistakes=[`${text} → ${st.res.corrected}`,...(S.mistakes||[])].slice(0,20);
  save();renderWrite();
 }catch(e){
  if(e.code==="need-pin"){const m=aiMsg(e);res.innerHTML=`<p class="muted">${esc(m[0])}<span class="mg">${esc(m[1])}</span></p>`;btn.disabled=false;btn.textContent="Check my sentence · Hamarino";return}
  st.err=aiMsg(e);st.pending=true;save();renderWrite();
 }
}
const pendingKeys=()=>S.daily.keys.filter(k=>{const st=S.daily.sent[k];return st&&st.pending&&!st.res});
function nextWrite(){const d=S.daily;
 if(d.redo){const left=pendingKeys().filter(k=>d.keys.indexOf(k)>d.wi);d.wi=left.length?d.keys.indexOf(left[0]):d.keys.length;if(!left.length)d.redo=false}
 else d.wi++;
 save();renderWrite()}
function finishDaily(){const d=S.daily;
 d.keys.forEach(k=>{const v=S.vocab[k],st=d.sent[k]||{};if(!v.box){v.box=1;v.due=addDays(today(),1)}if(!st.ok&&!st.pending&&!(st.res&&st.res.local))S.hard[k]=S.hard[k]||0});
 d.phase="done";d.finished=d.finished||Date.now();markDay();save();dailySummary();
}
function dailySummary(){const d=S.daily;window.scrollTo(0,0);
 const checked=d.keys.filter(k=>d.sent[k]&&d.sent[k].res&&!d.sent[k].res.local),good=checked.filter(k=>d.sent[k].ok).length;
 const mins=Math.max(1,Math.round(((d.finished||Date.now())-d.started)/60000));
 view.innerHTML=`<div class="stack" style="text-align:center;align-items:center;padding-top:12px"><p class="kicker">Daily words · Vita!</p><span class="score-ring">${d.keys.length}</span><h2>new words today</h2><p class="muted">${checked.length?`${good} of ${checked.length} sentences correct · `:""}${d.review.length?`${d.review.length} reviewed · `:""}${mins} min</p></div>
 <div class="stack" style="margin-top:18px">${pendingKeys().length?`<section class="panel stack tight" style="border-color:var(--gold);background:var(--gold-soft)"><h3>${pendingKeys().length} sentence${pendingKeys().length>1?"s":""} not checked yet</h3><p class="muted">They are saved. Connect to the internet and check them now.<span class="mg">Voatahiry ireo. Mampifandraisa amin'ny internet dia hamarino.</span></p><button class="btn primary" data-act="dpending">Check them now · Hamarino izao</button></section>`:""}<section class="panel stack tight"><h3>Today's words</h3>${d.keys.map(k=>{const v=S.vocab[k],st=d.sent[k]||{},line=st.ok?st.text:(st.res&&st.res.corrected)||"";return `<div class="wrow"><button class="say" data-act="sayvocab" data-k="${k}" aria-label="Listen">${ICON.spk}</button><div style="min-width:0"><b>${esc(v.en)}</b> · ${esc(v.mg)}${line?`<span class="mg" style="font-style:normal">“${esc(line.trim())}”</span>`:""}</div></div>`}).join("")}</section>
 <p class="muted" style="font-size:.9rem">These words come back for review after 1, 2, 4, 7, 15 and 30 days, so they stay in your memory. Words with wrong sentences also go to your difficult words.<span class="mg">Hiverina ireo teny ireo mba tsy hohadinoina.</span></p>
 <button class="btn primary" data-act="home">Back to my course</button></div>`;
}

/* ================= REVIEW ================= */
let R=null;
function startReview(){const keys=shuffle(Object.keys(S.hard)).slice(0,8);R={keys,i:0,right:0,answered:false};renderReview()}
function renderReview(){
 window.scrollTo(0,0);
 if(R.i>=R.keys.length){view.innerHTML=`<div class="stack" style="padding-top:12px;text-align:center;align-items:center"><p class="kicker">Practice done</p><span class="score-ring">${R.right}/${R.keys.length}</span><p class="muted">${Object.keys(S.hard).length} difficult words left. A word leaves the list after two correct answers in a row.</p></div><div style="margin-top:18px"><button class="btn primary" data-act="home">Back to my course</button></div>`;markDay();return}
 const k=R.keys[R.i];if(!R.opts){const others=shuffle(Object.keys(W).filter(x=>x!==k)).slice(0,3);R.opts=shuffle([k,...others])}
 view.innerHTML=`<div class="top"><button class="x" data-act="home" aria-label="Stop practice">${ICON.x}</button><div class="bar"><i style="width:${pct(R.i/R.keys.length)}%"></i></div></div>
 <div class="stack"><p class="kicker">Difficult words · Teny sarotra</p><div class="row"><h1>${esc(W[k][0])}</h1><button class="say" data-act="sayword" data-k="${k}" aria-label="Listen">${ICON.spk}</button></div><span class="say-as">${esc(W[k][1])}</span>
 <h3>What does it mean in Malagasy?</h3>
 <div class="opts">${R.opts.map(o=>{let c="";if(R.answered){if(o===k)c=" right";else if(o===R.pick)c=" wrong"}return `<button class="opt${c}" data-act="rans" data-k="${o}" ${R.answered?"disabled":""}>${esc(W[o][2])}</button>`}).join("")}</div>
 ${R.answered?`<p class="ex">${esc(W[k][5])}</p><button class="btn primary" data-act="rnext">Next</button>`:""}</div>`;
 if(!R.answered)say(W[k][0]);
}
function reviewAnswer(o){if(R.answered)return;const k=R.keys[R.i];R.answered=true;R.pick=o;
 if(o===k){R.right++;S.hard[k]=(S.hard[k]||0)+1;if(S.hard[k]>=2)delete S.hard[k]}else S.hard[k]=0;save();renderReview()}

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
 const w=e.target.closest(".w");if(w){openWord(w.dataset.w);return}
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
 switch(a){
  case "home":if(rec){try{rec.abort()}catch(x){}}if(TTS)speechSynthesis.cancel();home();break;
  case "starttest":startTest();break;
  case "tplay":say(T.items[T.i].audio,false);break;
  case "tplayslow":say(T.items[T.i].audio,true);break;
  case "tans":testAnswer(+b.dataset.i,b);break;
  case "tnext":testNext();break;
  case "lesson":openLesson(b.dataset.id);break;
  case "playall":playLines(L.lesson.lines.map(x=>x[1]));break;
  case "sayline":say(L.lesson.lines[+b.dataset.i][1]);hl(+b.dataset.i);break;
  case "slow":S.slow=!S.slow;save();b.setAttribute("aria-pressed",S.slow);break;
  case "sayword":say(W[b.dataset.k][0]);break;
  case "reveal":{const d=view.querySelector(`[data-mean="${b.dataset.k}"]`);d.hidden=!d.hidden;b.textContent=d.hidden?"Show meaning":"Hide meaning";if(!d.hidden){S.seen[b.dataset.k]=(S.seen[b.dataset.k]||0)+1;save()}break}
  case "lnext":L.step++;if(L.step===4&&!L.lesson.writing)L.step=5;renderLesson();break;
  case "qans":qAnswer(+b.dataset.i);break;
  case "qnext":qNext();break;
  case "ml":matchPick("l",b.dataset.k);break;
  case "mr":matchPick("r",b.dataset.k);break;
  case "hear":say(SPK[b.dataset.sid],false);break;
  case "hearslow":say(SPK[b.dataset.sid],true);break;
  case "mic":startMic(b.dataset.sid,b);break;
  case "self":{const id=b.dataset.sid,box=document.getElementById(id);SPKRES[id]=b.dataset.v==="1"?"self-ok":"self-practice";box.querySelector(".spk-res").innerHTML=`<p class="muted">${b.dataset.v==="1"?"Well done. Say it two more times to remember it.":"Listen with Slow, then repeat it three times."}</p>`;break}
  case "review":startReview();break;
  case "rans":reviewAnswer(b.dataset.k);break;
  case "rnext":R.i++;R.answered=false;R.opts=null;renderReview();break;
  case "closesheet":closeSheet();break;
  case "askreset":document.getElementById("resetBox").innerHTML=`<div class="confirm"><p><b>Delete all progress?</b> Your level, scores and word list will be removed from this phone.</p><div class="row"><button class="btn" data-act="doreset" style="border-color:var(--red);color:var(--red)">Delete progress</button><button class="btn ghost" data-act="home">Keep it</button></div></div>`;break;
  case "doreset":S=fresh();save();home();break;
  case "copycode":{const done=()=>{b.textContent="Copied";setTimeout(()=>{b.textContent=b.dataset.label||"Copy"},1500)};b.dataset.label=b.dataset.label||b.textContent;
   try{navigator.clipboard.writeText(S.code).then(done).catch(()=>selectCode())}catch(x){selectCode()}break}
  case "codesaved":S.codeSaved=true;save();home();break;
  case "owncode":{const box=document.getElementById(b.dataset.box||"restoreBox");box.innerHTML=ownCodeForm();box.querySelector("input").focus();break}
  case "saveowncode":saveOwnCode();break;
  case "daily":startDaily();break;
  case "dcount":S.dailyCount=+b.dataset.n;save();dailyIntro();break;
  case "dstart":beginDaily();break;
  case "money":openMoney(+b.dataset.i);break;
  case "moneylist":{const box=document.getElementById("moneyList");box.innerHTML=box.innerHTML?"":moneyList();b.textContent=box.innerHTML?"Hide the list":`See all ${MONEY.length} money lessons`;break}
  case "dredo":redoDaily();break;
  case "dflip":D.flip=true;renderCard();break;
  case "dnext":S.daily.i++;D.flip=false;save();renderCard();break;
  case "drate":rateCard(b.dataset.v==="1");break;
  case "dsay":say(S.vocab[curCardKey()].en);break;
  case "dsayex":{const d=S.daily,k=d.phase==="write"?d.keys[d.wi]:curCardKey();say(S.vocab[k].ex[+b.dataset.i]);break}
  case "dsaycorr":{const d=S.daily,st=d.sent[d.keys[d.wi]];if(st&&st.res)say(st.res.corrected);break}
  case "dcheck":checkSentence();break;
  case "dtry":{const d=S.daily,st=d.sent[d.keys[d.wi]];st.res=null;save();renderWrite();const t=document.getElementById("sentBox");if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}break}
  case "dskip":{const d=S.daily,k=d.keys[d.wi];d.sent[k]=Object.assign(d.sent[k]||{},{skipped:true});nextWrite();break}
  case "dwnext":nextWrite();break;
  case "dlater":nextWrite();break;
  case "dpending":{const d=S.daily,p=pendingKeys();if(!p.length)break;d.phase="write";d.redo=true;d.wi=d.keys.indexOf(p[0]);save();renderDaily();break}
  case "dailysummary":dailySummary();break;
  case "sayvocab":say(S.vocab[b.dataset.k].en);break;
  case "showrestore":{const box=document.getElementById("restoreBox");box.innerHTML=restoreForm();box.querySelector("input").focus();break}
  case "dorestore":doRestore();break;
  case "levelup":startLevelUp();break;
  case "ailesson":createAiLesson(b.dataset.news==="1");break;
  case "pinok":pinDone(true);break;
  case "pincancel":pinDone(false);break;
  case "checkwrite":checkWriting();break;
  case "skipwrite":L.skipWrite=true;L.step=5;renderLesson();break;
  case "spktips":speakingTips(b.dataset.sid,b);break;
  case "voice":openVoiceSheet();break;
  case "pickvoice":{const v=enVoices()[+b.dataset.i];if(v){S.voiceURI=v.voiceURI;save();pickVoice();say(SAMPLE,false);openVoiceSheet()}break}
  case "tryvoice":{const v=enVoices()[+b.dataset.i];if(v&&TTS){speechSynthesis.cancel();const u=utter(SAMPLE,false);u.voice=v;u.lang=v.lang;speechSynthesis.speak(u)}break}
  case "trysample":say(SAMPLE,false);break;
  case "voicereset":S.voiceURI=null;S.pitch=1.15;S.rate=0.92;save();pickVoice();openVoiceSheet();break;
 }
});
document.addEventListener("input",e=>{
 if(e.target.id==="pitch"||e.target.id==="rate"){const v=+e.target.value;S[e.target.id]=v;const lab=document.getElementById(e.target.id+"V");if(lab)lab.textContent=v.toFixed(2);save()}
 if(e.target.id==="writeBox"&&L)L.writeText=e.target.value;
 if(e.target.id==="sentBox"&&S.daily){const k=S.daily.keys[S.daily.wi];if(k){S.daily.sent[k]=Object.assign(S.daily.sent[k]||{tries:0},{text:e.target.value});persistLocal()}}});
document.addEventListener("change",e=>{if(e.target.id==="pitch"||e.target.id==="rate")say(SAMPLE,false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(e.key==="Enter"&&e.target.id==="restoreCode")doRestore();if(e.key==="Enter"&&e.target.id==="pinBox")pinDone(true);if(e.key==="Enter"&&e.target.id==="ownCode")saveOwnCode()});
function selectCode(){const el=document.querySelector(".codebox");if(!el)return;const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}
home();
pullOnStart();
</script>
